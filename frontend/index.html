<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        input {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 90%;
        }
        button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        .register-btn {
            background-color: gray;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

    <div id="auth-container" class="container">
        <h2>Login</h2>
        <form hx-post="/login" hx-target="#response" hx-swap="innerHTML">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="response"></p>
        <button class="register-btn" hx-on:click="swapRegister()">Register</button>
    </div>

    <!-- Registration Form Template (Hidden) -->
    <template id="register-template">
        <div id="auth-container" class="container">
            <h2>Register</h2>
            <form hx-post="/register" hx-target="#register-response" hx-swap="innerHTML">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                <button type="submit">Register</button>
            </form>
            <p id="register-response"></p>
            <button class="register-btn" hx-on:click="swapLogin()">Back to Login</button>
        </div>
    </template>

    <script>
        function swapRegister() {
            let template = document.getElementById("register-template").content.cloneNode(true);
            document.getElementById("auth-container").replaceWith(template);
        }

        function swapLogin() {
            let template = document.createElement("div");
            template.innerHTML = `
                <div id="auth-container" class="container">
                    <h2>Login</h2>
                    <form hx-post="/login" hx-target="#response" hx-swap="innerHTML">
                        <input type="text" name="username" placeholder="Username" required>
                        <input type="password" name="password" placeholder="Password" required>
                        <button type="submit">Login</button>
                    </form>
                    <p id="response"></p>
                    <button class="register-btn" hx-on:click="swapRegister()">Register</button>
                </div>`;
            document.getElementById("auth-container").replaceWith(template.firstChild);
        }
    </script>

</body>
</html>
